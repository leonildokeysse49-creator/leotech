<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — Leotech</title>
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="brand"><span class="brand-mark">L</span><span class="brand-name">Leotech</span></a>
      <nav class="main-nav" id="mainNav"><a href="index.html">Início</a><a href="servicos.html">Serviços</a><a href="loja.html">Loja</a><a href="sobre.html">Sobre</a><a href="contacto.html">Contacto</a></nav>
      <div class="header-actions">
        <div class="lang" id="langSwitch">
          <button class="lang-btn" type="button"><i class="fa-solid fa-globe"></i><span id="langLabel">Português</span><i class="fa-solid fa-chevron-down" style="font-size:.7em"></i></button>
          <ul class="lang-menu"><li><button type="button" data-lang-btn="pt">Português</button></li><li><button type="button" data-lang-btn="en">English</button></li></ul>
        </div>
        <div id="authWrap"></div>
        <button class="menu-toggle" id="menuToggle"><i class="fa-solid fa-bars"></i></button>
      </div>
    </div>
  </header>

  <main>
    <section class="auth-page">
      <div class="container auth-container">
        <div class="auth-card card">
          
          <div id="loginContainer">
            <div class="auth-head"><h1>Entrar</h1><p>Acede à tua conta Leotech</p></div>
            <form id="loginForm" novalidate>
              <label class="field"><span>Email</span><input class="input" type="email" name="email" required placeholder="exemplo@email.com"></label>
              <label class="field"><span>Palavra-passe</span><input class="input" type="password" name="password" required placeholder="••••••••"></label>
              <div class="form-foot" style="margin-bottom: 20px;">
                <span></span>
                <a href="#" id="recoverLink" class="link-muted">Esqueceste a palavra-passe?</a>
              </div>
              <button type="submit" class="btn btn-primary btn-block" id="loginBtn"><i class="fa-solid fa-right-to-bracket"></i> <span>Entrar</span></button>
              <p class="form-status" id="loginStatus" hidden></p>
            </form>
            <div class="auth-foot"><span>Ainda não tens conta?</span><a href="registo.html">Criar conta</a></div>
          </div>

          <div id="recoverContainer" hidden>
            <div class="auth-head"><h1>Recuperar Conta</h1><p>Enviaremos um link para o teu email.</p></div>
            <form id="recoverForm" novalidate>
              <label class="field"><span>O teu Email</span><input class="input" type="email" name="email" required placeholder="exemplo@email.com"></label>
              <button type="submit" class="btn btn-primary btn-block" id="btnRecover"><i class="fa-solid fa-paper-plane"></i> Enviar Link</button>
              <p class="form-status" id="recoverStatus" hidden></p>
            </form>
            <div class="auth-foot"><a href="#" id="backToLoginLink">Voltar ao Login</a></div>
          </div>

        </div>
      </div>
    </section>
  </main>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/nav.js"></script>
  <script src="assets/js/login.js"></script>
</body>
</html>
