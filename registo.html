<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar conta — Leotech</title>
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="brand"><span class="brand-mark">L</span><span class="brand-name">Leotech</span></a>
      <nav class="main-nav" id="mainNav"><a href="index.html">Início</a><a href="servicos.html">Serviços</a><a href="loja.html">Loja</a><a href="sobre.html">Sobre</a><a href="contacto.html">Contacto</a></nav>
      <div class="header-actions">
        <div class="lang" id="langSwitch">
          <button class="lang-btn" type="button"><i class="fa-solid fa-globe"></i><span id="langLabel">Português</span><i class="fa-solid fa-chevron-down" style="font-size:.7em"></i></button>
          <ul class="lang-menu"><li><button type="button" data-lang-btn="pt">Português</button></li><li><button type="button" data-lang-btn="en">English</button></li></ul>
        </div>
        <div id="authWrap"></div>
        <button class="menu-toggle" id="menuToggle"><i class="fa-solid fa-bars"></i></button>
      </div>
    </div>
  </header>

  <main>
    <section class="auth-page">
      <div class="container auth-container">
        <div class="auth-card card">
          <div class="auth-head">
            <h1 data-i18n="registo.title">Criar conta</h1>
            <p data-i18n="registo.subtitle">Junta-te à Leotech</p>
          </div>
          
          <form id="registoForm" novalidate>
            <label class="field">
              <span data-i18n="registo.name">Nome completo</span>
              <input class="input" type="text" name="name" required data-i18n-placeholder="registo.namePh" placeholder="O teu nome">
            </label>
            <label class="field">
              <span data-i18n="registo.email">Email</span>
              <input class="input" type="email" name="email" required data-i18n-placeholder="registo.emailPh" placeholder="exemplo@email.com">
            </label>
            <label class="field">
              <span data-i18n="registo.password">Palavra-passe</span>
              <input class="input" type="password" name="password" required data-i18n-placeholder="registo.passwordPh" placeholder="Mínimo 6 caracteres">
              <small class="field-hint" data-i18n="registo.passwordHint">Mínimo 6 caracteres</small>
            </label>
            <label class="field">
              <span data-i18n="registo.password2">Confirmar palavra-passe</span>
              <input class="input" type="password" name="password2" required data-i18n-placeholder="registo.password2Ph" placeholder="Repete a palavra-passe">
            </label>
            <button type="submit" class="btn btn-primary btn-block" id="registoBtn"><i class="fa-solid fa-user-plus"></i> <span data-i18n="registo.submit">Criar conta</span></button>
            <p class="form-status" id="registoStatus" hidden></p>
          </form>

          <div class="auth-foot">
            <span data-i18n="registo.hasAccount">Já tens conta?</span>
            <a href="login.html" data-i18n="registo.login">Entrar</a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/nav.js"></script>
  <script src="assets/js/registo.js"></script>
</body>
</html>
